; Minimal LED-receiver firmware for the DIY sync box.
; Most people should just flash WLED (https://install.wled.me) instead - this
; sketch exists to show what WLED does under the hood and for wired-only builds.
[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps = fastled/FastLED@^3.7.0
build_flags =
    -DNUM_LEDS=224          ; total LEDs on the strip
    -DDATA_PIN=16           ; GPIO driving the strip (through a level shifter)
    -DMAX_MILLIAMPS=8000    ; FastLED power limiter, set to ~80% of your PSU
    -DSERIAL_BAUD=500000    ; Adalight over USB; WLED default is 115200

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1

[env:esp8266]
platform = espressif8266
board = d1_mini
build_flags = ${env.build_flags} -DDATA_PIN=2
